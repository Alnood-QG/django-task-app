<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
<!-- Main code ..............................................................START.....-->
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark text-center">
                        <h3> Edit Task: {{ task.title }}</h3>
                    </div>
                    <div class="card-body">
<!-- Form error message ..............................................................START....-->
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                 Please check the data.
                                <ul class="mb-0 mt-2">
                                    {% for field in form %}
                                        {% for error in field.errors %}
                                            <li>{{ field.label }}: {{ error }}</li>
                                        {% endfor %}
                                    {% endfor %}
                                </ul>
                            </div>
                        {% endif %}
<!-- Form error message ...............................................................END.....-->
<!-- Form  ...........................................................START...........-->                       
                        <form method="POST">
                            {% csrf_token %}

 <!--............................ Title -->
                            <div class="mb-3">
                                <label for="{{ form.title.id_for_label }}" class="form-label">Title</label>
                                <input type="text" name="{{ form.title.name }}" 
                                       id="{{ form.title.id_for_label }}" 
                                       class="form-control" 
                                       value="{{ form.title.value|default:'' }}">
                            </div>
                            
  
 <!--............................ Description -->
                            <div class="mb-3">
                                <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
                                <textarea name="{{ form.description.name }}" 
                                          id="{{ form.description.id_for_label }}" 
                                          class="form-control" 
                                          rows="4">{{ form.description.value|default:'' }}</textarea>
                            </div>
                            
  
 <!--............................ Completed (checkbox) -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" name="{{ form.completed.name }}" 
                                       id="{{ form.completed.id_for_label }}" 
                                       class="form-check-input"
                                       {% if form.completed.value %}checked{% endif %}>
                                <label for="{{ form.completed.id_for_label }}" class="form-check-label">Completed</label>
                            </div>
                            
                            <div class="d-flex justify-content-between mt-3">
                                <button type="submit" class="btn btn-warning">Save Changes</button>
                                <a href="{% url 'home' %}" class="btn btn-secondary"> Cancel</a>
                            </div>
                        </form>
<!-- Form  ...........................................................END.............-->
                    </div>
                </div>
<!-- Main code ..............................................................END.......-->
            </div>
        </div>
    </div>
</body>
</html>
