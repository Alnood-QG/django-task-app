<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
<!-- Main code ..............................................................START.....-->
                    <div class="card-header bg-primary text-white text-center">
                        <h1>Login</h1>
                    </div>
                    <div class="card-body">
                         {% if form.errors %}
                        <div class="alert alert-danger">Username or Pasworde incorrect </div>
                        {% endif %}
<!-- Form  ..............................................................START........-->
                        <form method="POST">
                            {% csrf_token %}

                        <div class="mb-3">
                                <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                                <input type="text" name="{{ form.username.name }}" 
                                       id="{{ form.username.id_for_label }}" 
                                       class="form-control" 
                                       value="{{ form.username.value|default:'' }}">
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                                <input type="password" name="{{ form.password.name }}" 
                                       id="{{ form.password.id_for_label }}" 
                                       class="form-control">
                            </div>

                            <button type="submit" class="buttonGo btn btn-primary w-100 mt-3">Login</button>
                        </form>
<!-- Form  ...........................................................END.............-->
                         <hr>
                        <P class="text-center"><a href="{% url 'register' %}">Creat Account</a></P>
                    </div>
<!-- Main code ..............................................................END.......-->
                </div>
            </div>
        </div>  
    </div>
    
       
</body>
</html>
